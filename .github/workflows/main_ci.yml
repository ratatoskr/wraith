name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.run_id }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  lint:
    name: check format
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: install zig
        uses: mlugg/setup-zig@v2

      - name: check format
        continue-on-error: true
        run: zig fmt --check .

  build:
    name: Build ${{ matrix.name }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            optimize: ReleaseFast
          - name: Debug
            optimize: Debug
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: checkout repository
        uses: actions/checkout@v7


      - name: install zig
        uses: mlugg/setup-zig@v2
        with:
          # One cache per matrix entry, started fresh when build.zig.zon changes. If one ever goes
          # stale, `gh cache delete --all` clears them. Releases build without it.
          cache-key: ${{ matrix.optimize }}-${{ hashFiles('build.zig.zon') }}
          cache-size-limit: 900

      - name: build
        run: zig build -Doptimize=${{ matrix.optimize }} --summary all

  test:
    name: Test | ${{ matrix.arch }}-${{ matrix.backend }}-${{ matrix.optimize }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86]
        backend: [gnu, msvc]
        optimize: [Debug, ReleaseFast]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: checkout repository
        uses: actions/checkout@v7


      - name: install zig
        uses: mlugg/setup-zig@v2
        with:
          # One cache per matrix entry, started fresh when build.zig.zon changes. If one ever goes
          # stale, `gh cache delete --all` clears them. Releases build without it.
          cache-key: ${{ matrix.arch }}-${{ matrix.backend }}-${{ matrix.optimize }}-${{ hashFiles('build.zig.zon') }}
          cache-size-limit: 900

      - name: run tests
        run: zig build test -Doptimize=${{ matrix.optimize }} -Dtarget=${{ matrix.arch }}-windows-${{ matrix.backend }} --test-timeout 3m --summary all

  examples:
    name: Examples
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # What the examples make their types with
      WRAITH: ${{ github.workspace }}\zig-out\bin\wraith.exe
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: install zig
        uses: mlugg/setup-zig@v2
        with:
          cache-key: examples-${{ hashFiles('build.zig.zon') }}
          cache-size-limit: 900

      - name: install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: install node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: build wraith
        run: zig build --summary all

      # The cs kind's test needs a C# plugin, which only this builds
      - name: run tests with C#
        run: zig build test -Dcs-tests --test-timeout 3m --summary all

      - name: zig example
        working-directory: examples/zig
        run: |
          zig build --summary all

      - name: C example
        working-directory: examples/c
        run: zig build --summary all

      - name: C++ example
        working-directory: examples/cpp
        run: zig build --summary all

      # And with CMake and MSVC, which don't need Zig
      - name: C example, CMake
        working-directory: examples/c
        run: |
          cmake -B build -DWRAITH="$env:WRAITH"
          cmake --build build --config Release

      - name: C++ example, CMake
        working-directory: examples/cpp
        run: |
          cmake -B build -DWRAITH="$env:WRAITH"
          cmake --build build --config Release

      # Built with cargo, which the runner has, through the wraith just built
      - name: Rust example
        working-directory: examples/rust
        run: '& $env:WRAITH sdk rust build'

      - name: typescript example
        working-directory: examples/typescript
        run: |
          npm ci
          npm run build

      - name: C# example, NativeAOT
        working-directory: examples/csharp-aot
        run: dotnet publish

      - name: C# example, CoreCLR
        working-directory: examples/csharp-clr
        run: dotnet publish
