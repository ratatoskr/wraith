name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.run_id }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  lint:
    name: check format
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: install zig
        uses: mlugg/setup-zig@v2

      - name: check format
        continue-on-error: true
        run: zig fmt --check .

  build:
    name: Build ${{ matrix.name }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            optimize: ReleaseFast
          - name: Debug
            optimize: Debug
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: checkout repository
        uses: actions/checkout@v7


      - name: install zig
        uses: mlugg/setup-zig@v2
        with:
          # One cache per matrix entry, started fresh when build.zig.zon changes. If one ever goes
          # stale, `gh cache delete --all` clears them. Releases build without it.
          cache-key: ${{ matrix.optimize }}-${{ hashFiles('build.zig.zon') }}
          cache-size-limit: 900

      - name: build
        run: zig build -Doptimize=${{ matrix.optimize }} --summary all

  test:
    name: Test | ${{ matrix.arch }}-${{ matrix.backend }}-${{ matrix.optimize }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86]
        backend: [gnu, msvc]
        optimize: [Debug, ReleaseFast]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: checkout repository
        uses: actions/checkout@v7


      - name: install zig
        uses: mlugg/setup-zig@v2
        with:
          # One cache per matrix entry, started fresh when build.zig.zon changes. If one ever goes
          # stale, `gh cache delete --all` clears them. Releases build without it.
          cache-key: ${{ matrix.arch }}-${{ matrix.backend }}-${{ matrix.optimize }}-${{ hashFiles('build.zig.zon') }}
          cache-size-limit: 900

      - name: run tests
        run: zig build test -Doptimize=${{ matrix.optimize }} -Dtarget=${{ matrix.arch }}-windows-${{ matrix.backend }} --test-timeout 3m --summary all
